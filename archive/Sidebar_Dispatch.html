<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; padding: 12px; background: #f4f7f6; color: #333; }
    
    .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 15px; border-left: 5px solid #1a73e8; }
    h3 { margin: 0 0 12px 0; font-size: 14px; color: #202124; text-transform: uppercase; font-weight: 700; }
    
    label { display:block; margin-bottom: 4px; font-weight: 500; font-size: 11px; color: #5f6368; text-transform: uppercase; }
    input { width: 100%; padding: 8px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 13px; }
    
    .btn { display: block; width: 100%; padding: 10px; margin-top: 5px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; font-size: 13px; text-transform: uppercase; }
    .btn:active { transform: scale(0.98); }
    
    .btn-blue { background: #1a73e8; } .btn-blue:hover { background: #1557b0; }
    .btn-green { background: #0f9d58; } .btn-green:hover { background: #0b8043; }
    .btn-purple { background: #8e24aa; } .btn-purple:hover { background: #7b1fa2; }
    .btn-orange { background: #f09300; } .btn-orange:hover { background: #c07600; }
    .btn-dark { background: #444; } .btn-dark:hover { background: #222; }

    .row { display: flex; gap: 10px; }
    .col { flex: 1; }

    #status { font-size: 11px; text-align: center; padding: 10px; background: #e8f0fe; color: #1a73e8; border-radius: 5px; margin-top: 15px; font-weight: 500; border: 1px solid #d2e3fc; }
  </style>
</head>
<body>

  <div class="card">
    <h3>📅 Dispatch Center</h3>
    <div class="row">
      <div class="col"><label>Start Date</label><input type="date" id="sDate"></div>
      <div class="col"><label>End Date (Opt)</label><input type="date" id="eDate"></div>
    </div>
    <button class="btn btn-blue" onclick="runSchedule()">Build Schedule</button>
    <button class="btn btn-green" onclick="runBacklog()" style="margin-top:8px;">🌍 Route Entire Backlog</button>
  </div>

  <div class="card" style="border-left-color: #8e24aa;">
    <h3>⚡ Quick Add Job</h3>
    <label>Name & Address</label>
    <div class="row">
      <div class="col"><input type="text" id="qaName" placeholder="Name"></div>
      <div class="col"><input type="text" id="qaAddr" placeholder="123 Main St"></div>
    </div>
    <div class="row">
      <button class="btn btn-purple" style="flex:1" onclick="checkFit()">🔎 Find Best Tech</button>
      <button class="btn btn-dark" style="flex:1" onclick="addJob()">➕ Add Row</button>
    </div>
  </div>

  <div class="card" style="border-left-color: #f09300;">
    <h3>🛠 Fleet Tools</h3>
    <button class="btn btn-orange" onclick="google.script.run.showQuickMap()">🗺 Preview Map</button>
    <button class="btn btn-dark" style="background:#555; margin-top:8px;" onclick="google.script.run.exportFleetPDFs()">📄 Export PDF Manifests</button>
  </div>

  <div id="status">System Ready</div>

  <script>
    function runSchedule() {
      const s = document.getElementById('sDate').value;
      const e = document.getElementById('eDate').value;
      if(!s) return showStatus("❌ Pick a Start Date.");
      showStatus("⏳ Optimizing Routes...");
      google.script.run.withSuccessHandler(done).withFailureHandler(fail).optimizeRoutes(s, e);
    }

    function runBacklog() {
      showStatus("⏳ Routing ALL jobs...");
      google.script.run.withSuccessHandler(done).withFailureHandler(fail).optimizeRoutes(null);
    }

    function checkFit() {
      const addr = document.getElementById('qaAddr').value;
      if(!addr) return showStatus("❌ Enter address.");
      showStatus("🔍 Searching...");
      google.script.run.withSuccessHandler(res => {
        const r = JSON.parse(res);
        showStatus(r.message || r.error);
      }).findBestFitForJob(addr);
    }

    function addJob() {
      const name = document.getElementById('qaName').value;
      const addr = document.getElementById('qaAddr').value;
      if(!name || !addr) return showStatus("❌ Name/Address missing.");
      showStatus("💾 Saving...");
      google.script.run.withSuccessHandler(done).addJobToRoute(name, addr, null);
    }

    function showStatus(msg) { document.getElementById('status').innerText = msg; }
    function done(res) { showStatus("✅ " + res); }
    function fail(err) { showStatus("❌ Error: " + err.message); }
  </script>
</body>
</html>
